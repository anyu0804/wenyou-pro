name: Wenyou Pro Release Build

on:
  workflow_dispatch:
    inputs:
      mac_arch:
        description: "macOS target architecture (all = Apple Silicon + Intel)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - arm64
          - x64
      include_windows:
        description: "Also build Windows x64 installer and portable zip"
        required: false
        default: false
        type: boolean
      create_github_release:
        description: "Publish built artifacts to a GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "wenyou-v*"

permissions:
  contents: read

# Job-level concurrency is used instead of workflow-level cancellation so a newer
# workflow_dispatch build can cancel stalled builds without aborting an active release upload.
jobs:
  hygiene-and-tests:
    name: Path hygiene & release script tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wenyou-release-hygiene-and-tests-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run repository anti-doxxing and local path gate
        run: npm run check:paths

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pixi-sandbox dependencies
        run: npm --prefix packages/pixi-sandbox ci --no-audit --no-fund

      - name: Run wenyou-release unit tests
        run: node --test scripts/wenyou-release/*.test.mjs

  build-macos:
    name: Build & verify macOS (${{ github.event_name == 'workflow_dispatch' && inputs.mac_arch || 'all' }})
    needs: hygiene-and-tests
    runs-on: macos-latest
    timeout-minutes: 45
    concurrency:
      group: wenyou-release-build-macos-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_FOR_PULL_REQUEST: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      TARGET_MAC_ARCH: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_arch || 'all' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pixi-sandbox dependencies
        run: npm --prefix packages/pixi-sandbox ci --no-audit --no-fund

      - name: Build macOS DMG and ZIP installers
        run: node scripts/wenyou-release/build-installer.mjs --platform mac --arch "${TARGET_MAC_ARCH}"

      - name: Verify macOS release package (asar, codesign, hdiutil, path gate)
        run: node scripts/wenyou-release/verify-package.mjs --platform mac --arch "${TARGET_MAC_ARCH}"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wenyou-Pro-macOS
          path: |
            dist/wenyou-pro-*-mac/*.dmg
            dist/wenyou-pro-*-mac/*.zip
            dist/wenyou-pro-*-mac/SHA256SUMS.txt
            dist/wenyou-pro-*-mac/使用说明.txt
          if-no-files-found: error

  build-windows:
    name: Build & verify Windows x64
    needs: hygiene-and-tests
    if: github.event_name == 'push' || inputs.include_windows == true
    runs-on: windows-latest
    timeout-minutes: 45
    concurrency:
      group: wenyou-release-build-windows-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Provision embedded Python 3.13.2 runtime for Windows ntqq-vfs
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonDir = "packages/desktop/resources/ntqq-vfs/python"
          $pythonExe = Join-Path $pythonDir "python.exe"
          if (-not (Test-Path $pythonExe)) {
            $zipPath = Join-Path $env:RUNNER_TEMP "python-3.13.2-embed-amd64.zip"
            $url = "https://www.python.org/ftp/python/3.13.2/python-3.13.2-embed-amd64.zip"
            New-Item -ItemType Directory -Force -Path $pythonDir | Out-Null
            $maxAttempts = 3
            $downloaded = $false
            for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                Write-Host "Downloading embedded Python 3.13.2 (attempt $attempt/$maxAttempts)..."
                if (Test-Path $zipPath) {
                  Remove-Item -Force $zipPath
                }
                Invoke-WebRequest -Uri $url -OutFile $zipPath -TimeoutSec 120
                $downloaded = $true
                break
              } catch {
                Write-Warning "Download attempt $attempt/$maxAttempts failed: $($_.Exception.Message)"
                if ($attempt -eq $maxAttempts) {
                  throw
                }
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if (-not $downloaded -or -not (Test-Path $zipPath)) {
              throw "Failed to download embedded Python zip after $maxAttempts attempts"
            }
            Expand-Archive -Path $zipPath -DestinationPath $pythonDir -Force
            Remove-Item -Force $zipPath
          }
          if (-not (Test-Path $pythonExe)) {
            throw "Failed to provision embedded Python runtime at $pythonExe"
          }
          & $pythonExe -B -c "import sys, sqlite3, ctypes; assert sys.version_info[:2] == (3, 13); print('py-ok')"
          if ($LASTEXITCODE -ne 0) {
            throw "Embedded Python smoke check failed with exit code $LASTEXITCODE"
          }

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pixi-sandbox dependencies
        run: npm --prefix packages/pixi-sandbox ci --no-audit --no-fund

      - name: Build Windows x64 Setup and Portable zip
        run: npm run package:wenyou

      - name: Verify Windows x64 release package
        run: npm run package:wenyou:verify

      - name: Upload Windows x64 release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wenyou-Pro-Windows-x64
          path: |
            dist/wenyou-pro-*-win-x64/*.exe
            dist/wenyou-pro-*-win-x64/*.zip
            dist/wenyou-pro-*-win-x64/SHA256SUMS.txt
            dist/wenyou-pro-*-win-x64/使用说明.txt
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: >-
      always() && !cancelled() &&
      needs.build-macos.result == 'success' &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (github.event_name == 'push' || inputs.create_github_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: wenyou-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: Wenyou-Pro-macOS
          path: release-staging/mac

      - name: Download Windows release artifacts (when built)
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Wenyou-Pro-Windows-x64
          path: release-staging/win

      - name: Create or update GitHub Release
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_BUILD_RESULT: ${{ needs.build-windows.result }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="wenyou-v${VERSION}"
          fi

          STAGE_ARGS=(--mac-dir release-staging/mac --out-dir release-upload)
          if [ "${WIN_BUILD_RESULT}" = "success" ]; then
            STAGE_ARGS+=(--win-dir release-staging/win --require-windows)
          fi
          node scripts/wenyou-release/stage-release-assets.mjs "${STAGE_ARGS[@]}"

          shopt -s nullglob
          UPLOAD_FILES=(release-upload/*)
          if [ "${#UPLOAD_FILES[@]}" -eq 0 ]; then
            echo "::error::Release staging hard gate failed: release-upload/ contains 0 files." >&2
            exit 1
          fi

          printf '%s\n' \
            "## 司命 · 文游 Pro（Wenyou Pro v${VERSION}）" \
            "" \
            "制作与整理：安钰（基于 Percho MIT 开源底座定制）" \
            "" \
            "- **macOS**：Apple Silicon (M1–M4) 选择 \`arm64.dmg\`，Intel Mac 选择 \`x64.dmg\`；首次打开请按 \`README-macOS.txt\` 放行 Gatekeeper 或执行 \`xattr -cr \"/Applications/Wenyou Pro.app\"\`。" \
            "- **Windows x64**（如随本次构建发布）：选择 \`Setup-x64.exe\` 或绿色便携版 \`Portable-x64.zip\`（说明见 \`README-Windows-x64.txt\`）。" \
            "- 所有安装包均附带对应平台 \`SHA256SUMS\` 校验清单。" \
            > release-notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${UPLOAD_FILES[@]}" --clobber
          else
            gh release create "${TAG}" "${UPLOAD_FILES[@]}" \
              --title "Wenyou Pro v${VERSION}" \
              --notes-file release-notes.md
          fi
