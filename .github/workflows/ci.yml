name: Wenyou Pro CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wenyou-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Hygiene, repo guard, typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run repository anti-doxxing and local path gate
        run: npm run check:paths

      - name: Verify GitHub anti-lockout workflow and repo guard
        run: node scripts/wenyou-release/configure-github-repo.mjs --verify

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pixi-sandbox dependencies
        run: npm --prefix packages/pixi-sandbox ci --no-audit --no-fund

      - name: Run pixi-sandbox unit tests
        run: npm --prefix packages/pixi-sandbox run test

      - name: Build pixi-sandbox desktop bundle
        run: npm --prefix packages/pixi-sandbox run build:desktop

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run release script tests
        run: npm run test:release

      - name: Run wenyou-release unit tests
        run: node --test scripts/wenyou-release/*.test.mjs

      - name: Run Vitest suite
        run: npx vitest run
